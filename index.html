<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Lumabloom · Flores y Regalos</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --azul-principal:#4A7B9D;
    --azul-oscuro:#2c5a7a;
    --azul-claro:#7AA3C2;
    --azul-suave:#d4e4f0;
    --azul-muy-suave:#e8f0f7;
    --azul-fondo:#f0f8ff; /* Azul bien clarito para el fondo */
    --marron:#6d5c5c;
    --fondo:#f0f8ff; /* Cambiado a azul clarito */
    --texto:#333;
    --sombra-suave:0 10px 30px rgba(74, 123, 157, 0.1);
    --sombra-media:0 15px 35px rgba(74, 123, 157, 0.15);
    --sombra-fuerte:0 20px 40px rgba(74, 123, 157, 0.2);
    --azul-gradient:linear-gradient(135deg, #3a95d6 0%, #3a95d6 100%);
}

body{
    margin:0;
    font-family:'Montserrat', sans-serif;
    background:var(--fondo);
    color:var(--texto);
    transition:0.3s;
    background-image: radial-gradient(var(--azul-suave) 1px, transparent 1px);
    background-size: 30px 30px;
}

/* WHATSAPP FLOTANTE */
.whatsapp-flotante {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #25D366;
    color: white;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
    z-index: 999;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-decoration: none;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); }
    50% { transform: scale(1.1); box-shadow: 0 15px 35px rgba(37, 211, 102, 0.6); }
    100% { transform: scale(1); box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); }
}

.whatsapp-flotante:hover {
    transform: scale(1.15) rotate(5deg);
    background: #128C7E;
    box-shadow: 0 20px 40px rgba(18, 140, 126, 0.5);
}

/* BOTÓN DE IDIOMA */
.idioma-btn {
    cursor:pointer;
    font-size:28px;
    background: var(--azul-gradient);
    border: 2px solid white;
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
    font-weight: 700;
    box-shadow: 0 5px 15px rgba(74, 123, 157, 0.3);
}

.idioma-btn:hover {
    transform: rotate(360deg) scale(1.1);
    background: var(--azul-oscuro);
}

/* SUBIR ARRIBA */
.subir-arriba {
    position: fixed;
    bottom: 110px;
    right: 30px;
    background: var(--azul-principal);
    color: white;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    box-shadow: 0 5px 20px rgba(74, 123, 157, 0.4);
    z-index: 998;
    transition: 0.3s;
    text-decoration: none;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.subir-arriba.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.subir-arriba:hover {
    transform: translateY(-5px);
    background: var(--azul-oscuro);
    box-shadow: 0 10px 25px rgba(74, 123, 157, 0.6);
}

/* HEADER */
.banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:40px 60px;
    background: rgba(173, 205, 228, 0.5);
    backdrop-filter: blur(10px);
    position:relative;
    box-shadow: var(--sombra-suave);
    border-bottom: 1px solid rgba(74, 123, 157, 0.3);
}

.social{
    display:flex;
    gap:15px;
}

.social a{
    color:var(--azul-principal);
    font-size:32px;
    transition:0.3s;
}

.social a:hover{
    transform:scale(1.2) translateY(-3px);
    color: var(--azul-oscuro);
}

.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

.logo img{
    height:180px;
    transition: 0.3s;
    filter: drop-shadow(0 5px 15px rgba(74, 123, 157, 0.3));
}

.logo img:hover {
    transform: scale(1.05);
}

.right-icons{
    display:flex;
    align-items:center;
    gap:20px;
}

.admin{
    font-size:32px;
    cursor:pointer;
    color:var(--azul-principal);
    transition: 0.3s;
    position: relative;
}

.admin:hover {
    transform: scale(1.15);
    color: var(--azul-oscuro);
}

/* MODAL LOGIN ADMIN */
.admin-login-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    visibility: hidden;
    opacity: 0;
    transition: 0.3s;
}

.admin-login-modal.active {
    visibility: visible;
    opacity: 1;
}

.admin-login-content {
    background: white;
    padding: 40px;
    border-radius: 30px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: var(--sombra-fuerte);
    transform: scale(0.9);
    transition: 0.3s;
}

.admin-login-modal.active .admin-login-content {
    transform: scale(1);
}

.admin-login-content h2 {
    color: var(--azul-principal);
    margin-bottom: 30px;
    font-family: 'Playfair Display', serif;
}

.admin-login-content input {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    border: 2px solid var(--azul-suave);
    border-radius: 15px;
    font-size: 16px;
    font-family: 'Montserrat', sans-serif;
    box-sizing: border-box;
}

.admin-login-content input:focus {
    outline: none;
    border-color: var(--azul-principal);
}

.admin-login-buttons {
    display: flex;
    gap: 15px;
}

.admin-login-buttons button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 15px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Montserrat', sans-serif;
}

.btn-ingresar {
    background: var(--azul-gradient);
    color: white;
}

.btn-ingresar:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(74, 123, 157, 0.3);
}

.btn-cancelar {
    background: #f0f0f0;
    color: #666;
}

.btn-cancelar:hover {
    background: #e0e0e0;
}

/* PANEL ADMIN */
.admin-panel {
    position: fixed;
    top: 0;
    right: -100%;
    width: 100%;
    max-width: 500px;
    height: 100vh;
    background: white;
    box-shadow: var(--sombra-fuerte);
    z-index: 1500;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow-y: auto;
    padding: 30px;
    box-sizing: border-box;
}

.admin-panel.active {
    right: 0;
}

.admin-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--azul-suave);
}

.admin-panel-header h2 {
    color: var(--azul-principal);
    font-family: 'Playfair Display', serif;
    margin: 0;
}

.close-admin {
    font-size: 30px;
    cursor: pointer;
    color: var(--azul-principal);
    transition: 0.3s;
}

.close-admin:hover {
    transform: rotate(90deg);
    color: var(--azul-oscuro);
}

.admin-form {
    background: var(--azul-muy-suave);
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 30px;
}

.admin-form h3 {
    color: var(--azul-principal);
    margin-top: 0;
    margin-bottom: 20px;
}

.admin-form input, .admin-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 2px solid var(--azul-suave);
    border-radius: 12px;
    font-size: 14px;
    font-family: 'Montserrat', sans-serif;
    box-sizing: border-box;
}

.admin-form textarea {
    height: 100px;
    resize: vertical;
}

.admin-form input[type="file"] {
    padding: 8px;
    background: white;
}

.admin-form button {
    width: 100%;
    padding: 15px;
    background: var(--azul-gradient);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.admin-form button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(74, 123, 157, 0.3);
}

.admin-productos-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.admin-producto-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: var(--azul-muy-suave);
    border-radius: 15px;
}

.admin-producto-item img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 10px;
}

.admin-producto-info {
    flex: 1;
}

.admin-producto-info h4 {
    margin: 0 0 5px 0;
    color: var(--marron);
}

.admin-producto-info p {
    margin: 0;
    color: var(--azul-principal);
    font-weight: 600;
}

.btn-eliminar {
    background: #ff4444;
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.btn-eliminar:hover {
    transform: scale(1.1);
    background: #cc0000;
}

/* Overlay para admin */
.admin-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1400;
    visibility: hidden;
    opacity: 0;
    transition: 0.3s;
}

.admin-overlay.active {
    visibility: visible;
    opacity: 1;
}

/* Botón eliminar en productos (solo visible en modo admin) */
.producto .btn-eliminar-producto {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #ff4444;
    color: white;
    border: none;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    z-index: 10;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}

.producto .btn-eliminar-producto:hover {
    transform: scale(1.1);
    background: #cc0000;
}

.producto.modo-admin .btn-eliminar-producto {
    display: flex;
}

/* CATEGORÍAS */
.categorias{
    background: var(--azul-gradient);
    display:flex;
    justify-content:center;
    gap:60px;
    padding:20px 0;
    font-weight:600;
    box-shadow: 0 10px 20px rgba(74, 123, 157, 0.3);
    position: relative;
    z-index: 10;
}

.categorias a{
    text-decoration:none;
    color:white;
    font-size:18px;
    transition:0.3s;
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    position: relative;
    padding: 5px 0;
}

.categorias a::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: white;
    transition: 0.3s;
}

.categorias a:hover::before {
    width: 100%;
}

.categorias a:hover{
    opacity:1;
    transform:translateY(-2px);
}

/* SLIDER */
.slider{
    width:100%;
    height:500px;
    position:relative;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    filter: brightness(0.95);
}

.slide.active{
    opacity:1;
}

/* LINEA DIVISORIA PRINCIPAL */
.division-rosa{
    height:14px;
    background: var(--azul-gradient);
    margin:0;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
}

/* CATALOGO */
.catalogo{
    padding:20px 0px;
    text-align:center;
    background: transparent; /* Cambiado a transparente para que se vea el fondo azul */
    position: relative;
}

.catalogo h2{
    font-size:66px;
    margin-bottom:50px;
    font-family:'Playfair Display', serif;
    font-weight:700;
    color: var(--azul-principal);
    position: relative;
    display: inline-block;
    padding-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(74, 123, 157, 0.2);
}

.catalogo h2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    background: var(--azul-gradient);
    border-radius: 4px;
}

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
    padding:0 40px;
    max-width: 1400px;
    margin: 0 auto;
}

.producto{
    background:white;
    border-radius:20px;
    padding:20px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor:pointer;
    box-shadow: var(--sombra-suave);
    border: 1px solid rgba(74, 123, 157, 0.2);
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.6s ease forwards;
    opacity: 0;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.producto:nth-child(1) { animation-delay: 0.1s; }
.producto:nth-child(2) { animation-delay: 0.2s; }
.producto:nth-child(3) { animation-delay: 0.3s; }
.producto:nth-child(4) { animation-delay: 0.4s; }
.producto:nth-child(5) { animation-delay: 0.5s; }
.producto:nth-child(6) { animation-delay: 0.6s; }
.producto:nth-child(7) { animation-delay: 0.7s; }
.producto:nth-child(8) { animation-delay: 0.8s; }
.producto:nth-child(9) { animation-delay: 0.9s; }
.producto:nth-child(10) { animation-delay: 1s; }

.producto::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: 0.5s;
    z-index: 1;
    pointer-events: none;
}

.producto:hover::before {
    left: 100%;
}

.producto::after {
    content: 'VER PRODUCTO';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--azul-gradient);
    color: white;
    padding: 12px 25px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    transition: 0.3s;
    z-index: 2;
    letter-spacing: 1px;
    box-shadow: 0 10px 20px rgba(74, 123, 157, 0.5);
}

.producto:hover::after {
    opacity: 1;
}

.producto img{
    width:100%;
    height:280px;
    object-fit:cover;
    border-radius:15px;
    transition: 0.5s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.producto:hover img{
    transform: scale(0.95);
    filter: blur(1px) brightness(0.8);
}

.producto h3{
    margin:15px 0 8px;
    font-size:20px;
    color:var(--marron);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
}

.producto p{
    font-size:18px;
    color:var(--azul-principal);
    font-weight:700;
    font-family:'Montserrat', sans-serif;
}

/* LÍNEA DIVISORIA ENTRE PRODUCTOS Y CATEGORÍAS */
.linea-divisoria {
    width: 90%;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--azul-principal), var(--azul-claro), var(--azul-oscuro), var(--azul-claro), var(--azul-principal), transparent);
    margin: 20px auto 10px auto;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(74, 123, 157, 0.4);
    animation: brillo 3s infinite;
}

@keyframes brillo {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; box-shadow: 0 5px 30px rgba(74, 123, 157, 0.7); }
}

/* MODAL PRODUCTO */
.product-detail{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    visibility:hidden;
    opacity:0;
    transition:0.4s;
    z-index:1000;
}

.product-detail.active{
    visibility:visible;
    opacity:1;
}

.product-detail-content{
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding:30px;
    max-width:1000px;
    width:90%;
    display:flex;
    border-radius:25px;
    position:relative;
    gap:30px;
    flex-wrap:wrap;
    box-shadow: var(--sombra-fuerte);
    border: 1px solid rgba(74, 123, 157, 0.3);
    transform: scale(0.9);
    transition: 0.4s;
}

.product-detail.active .product-detail-content {
    transform: scale(1);
}

.close-detail{
    position:absolute;
    top:20px;
    right:20px;
    font-size:28px;
    cursor:pointer;
    color:var(--azul-principal);
    width: 45px;
    height: 45px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
    z-index: 10;
}

.close-detail:hover{
    transform: rotate(90deg) scale(1.1);
    color: var(--azul-oscuro);
}

.product-images{
    flex:1 1 400px;
}

.product-images img.main-img{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:20px;
    box-shadow: var(--sombra-media);
}

.thumbs{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap: wrap;
}

.thumbs img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    border:3px solid transparent;
    transition: 0.3s;
    box-shadow: var(--sombra-suave);
}

.thumbs img:hover, .thumbs img.active{
    border:3px solid var(--azul-principal);
    transform: translateY(-5px);
    box-shadow: var(--sombra-media);
}

.product-info{
    flex:1 1 350px;
}

.product-info h1{
    font-size:32px;
    color:var(--azul-principal);
    margin-bottom:15px;
    font-family:'Playfair Display', serif;
    font-weight:700;
}

.product-info p.description{
    margin-bottom:20px;
    line-height:1.8;
    font-family:'Montserrat', sans-serif;
    font-weight:500;
    color: #555;
    font-size: 16px;
}

.product-info p.price{
    font-size:28px;
    font-weight:800;
    color:var(--azul-principal);
    margin-bottom:25px;
    font-family:'Montserrat', sans-serif;
}

.product-info label{
    font-weight:600;
    font-family:'Montserrat', sans-serif;
    display: block;
    margin-bottom: 8px;
    color: var(--marron);
}

.product-info input[type=number]{
    width:80px;
    padding:10px;
    margin:0 0 25px 0;
    font-size:16px;
    border-radius:10px;
    border:2px solid var(--azul-suave);
    font-family:'Montserrat', sans-serif;
    text-align: center;
}

.product-info input[type=number]:focus {
    outline: none;
    border-color: var(--azul-principal);
}

.product-info button.whatsapp-btn{
    background: var(--azul-gradient);
    color:white;
    padding:15px 25px;
    border:none;
    border-radius:40px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    margin-bottom:20px;
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    width: 100%;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 10px 20px rgba(74, 123, 157, 0.3);
    position: relative;
    overflow: hidden;
}

.product-info button.whatsapp-btn::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: rgba(255, 255, 255, 0.5);
    opacity: 0;
    border-radius: 100%;
    transform: scale(1, 1) translate(-50%);
    transform-origin: 50% 50%;
}

.product-info button.whatsapp-btn:focus::after {
    animation: ripple 0.6s ease-out;
}

@keyframes ripple {
    0% { transform: scale(0, 0); opacity: 0.5; }
    100% { transform: scale(20, 20); opacity: 0; }
}

.product-info button.whatsapp-btn:hover{

<script>
// Variables globales
let productos = [];
let modoAdminActivo = false;
const CONTRASENA_ADMIN = "1302";

// Cargar productos al iniciar
cargarProductosIniciales();

function cargarProductosIniciales() {
    const productosGuardados = localStorage.getItem('lumabloomProductos');
    if (productosGuardados) {
        productos = JSON.parse(productosGuardados);
    } else {
        // Productos por defecto
        productos = [
            { id: 1, nombre: 'Ramo Rosado', desc: 'Hermoso ramo rosado con flores frescas y detalles elegantes. Perfecto para ocasiones especiales.', precio: '$29.990', imagen: '1.jpg' },
            { id: 2, nombre: 'Peluche con Flores', desc: 'Adorable peluche acompañado de un hermoso arreglo floral. El regalo perfecto.', precio: '$24.990', imagen: '2.jpg' },
            { id: 3, nombre: 'Taza Personalizada', desc: 'Taza de cerámica con diseño personalizado. Ideal para detalles únicos.', precio: '$14.990', imagen: '3.jpg' },
            { id: 4, nombre: 'Caja Regalo Deluxe', desc: 'Elegante caja con sorpresas y detalles especiales.', precio: '$39.990', imagen: '4.jpg' },
            { id: 5, nombre: 'Ramo de Tulipanes', desc: 'Colorido ramo de tulipanes frescos.', precio: '$34.990', imagen: '5.jpg' },
            { id: 6, nombre: 'Peluche Gigante', desc: 'Suave y enorme peluche para abrazar.', precio: '$49.990', imagen: '6.jpg' },
            { id: 7, nombre: 'Peluche Oso', desc: 'Oso de peluche con corazón bordado.', precio: '$49.990', imagen: '7.jpg' },
            { id: 8, nombre: 'Peluche Conejo', desc: 'Conejo de peluche suavecito.', precio: '$49.990', imagen: '8.jpg' },
            { id: 9, nombre: 'Peluche Perro', desc: 'Perrito de peluche con look tierno.', precio: '$49.990', imagen: '12.jpg' },
            { id: 10, nombre: 'Peluche Gato', desc: 'Gatito de peluche con bigotes bordados.', precio: '$49.990', imagen: '10.jpg' }
        ];
        guardarProductos();
    }
    renderizarProductos();
}

function guardarProductos() {
    localStorage.setItem('lumabloomProductos', JSON.stringify(productos));
}

function renderizarProductos() {
    const container = document.getElementById('productosContainer');
    container.innerHTML = '';
    
    productos.forEach(producto => {
        const productoHTML = `
            <div class="producto ${modoAdminActivo ? 'modo-admin' : ''}" data-id="${producto.id}">
                <button class="btn-eliminar-producto" onclick="eliminarProducto(${producto.id})"><i class="fas fa-trash"></i></button>
                <img src="${producto.imagen}" onclick="abrirDetalle('${producto.nombre}', '${producto.desc}', ['${producto.imagen}'], '${producto.precio}')">
                <h3>${producto.nombre}</h3>
                <p>${producto.precio}</p>
            </div>
        `;
        container.innerHTML += productoHTML;
    });
    
    // Actualizar lista en panel admin
    actualizarListaAdmin();
}

function actualizarListaAdmin() {
    const listaAdmin = document.getElementById('adminProductosList');
    if (!listaAdmin) return;
    
    listaAdmin.innerHTML = '';
    productos.forEach(producto => {
        const itemHTML = `
            <div class="admin-producto-item">
                <img src="${producto.imagen}" alt="${producto.nombre}">
                <div class="admin-producto-info">
                    <h4>${producto.nombre}</h4>
                    <p>${producto.precio}</p>
                </div>
                <button class="btn-eliminar" onclick="eliminarProducto(${producto.id})"><i class="fas fa-trash"></i></button>
            </div>
        `;
        listaAdmin.innerHTML += itemHTML;
    });
}

function abrirLoginAdmin() {
    document.getElementById('adminLoginModal').classList.add('active');
    document.getElementById('adminPassword').value = '';
    document.getElementById('adminPassword').focus();
}

function cerrarLoginAdmin() {
    document.getElementById('adminLoginModal').classList.remove('active');
}

function verificarAdmin() {
    const password = document.getElementById('adminPassword').value;
    if (password === CONTRASENA_ADMIN) {
        cerrarLoginAdmin();
        modoAdminActivo = true;
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('adminOverlay').classList.add('active');
        renderizarProductos(); // Re-renderizar para mostrar botones eliminar
    } else {
        alert('❌ Contraseña incorrecta');
    }
}

function cerrarAdminPanel() {
    modoAdminActivo = false;
    document.getElementById('adminPanel').classList.remove('active');
    document.getElementById('adminOverlay').classList.remove('active');
    renderizarProductos(); // Quitar botones eliminar
}

function eliminarProducto(id) {
    if (confirm('¿Estás seguro de eliminar este producto?')) {
        productos = productos.filter(p => p.id !== id);
        guardarProductos();
        renderizarProductos();
    }
}

function agregarProducto() {
    const nombre = document.getElementById('nuevoProductoNombre').value;
    const desc = document.getElementById('nuevoProductoDesc').value;
    const precio = document.getElementById('nuevoProductoPrecio').value;
    const imagenFile = document.getElementById('nuevoProductoImagen').files[0];
    
    if (!nombre || !desc || !precio || !imagenFile) {
        alert('Por favor completa todos los campos');
        return;
    }
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const nuevoProducto = {
            id: Date.now(),
            nombre: nombre,
            desc: desc,
            precio: precio,
            imagen: e.target.result
        };
        
        productos.push(nuevoProducto);
        guardarProductos();
        renderizarProductos();
        
        // Limpiar formulario
        document.getElementById('nuevoProductoNombre').value = '';
        document.getElementById('nuevoProductoDesc').value = '';
        document.getElementById('nuevoProductoPrecio').value = '';
        document.getElementById('nuevoProductoImagen').value = '';
        
        alert('✅ Producto agregado correctamente');
    };
    reader.readAsDataURL(imagenFile);
}

let slides=document.querySelectorAll(".slide");
let index=0;
function changeSlide(){
    slides[index].classList.remove("active");
    index=(index+1)%slides.length;
    slides[index].classList.add("active");
}
setInterval(changeSlide,7000);

/* MODAL PRODUCTO */
const productDetail = document.getElementById('productDetail');
const detailMainImg = document.getElementById('detailMainImg');
const detailTitle = document.getElementById('detailTitle');
const detailDesc = document.getElementById('detailDesc');
const thumbContainer = document.getElementById('thumbContainer');
const detailPrice = document.getElementById('detailPrice');
const detailCantidad = document.getElementById('detailCantidad');

function abrirDetalle(title, desc, imgs, price){
    detailTitle.textContent = title;
    detailDesc.textContent = desc;
    detailPrice.textContent = price;
    detailCantidad.value = 1;
    detailMainImg.src = imgs[0];

    thumbContainer.innerHTML = '';
    imgs.forEach((img,i)=>{
        const t = document.createElement('img');
        t.src = img;
        if(i===0) t.classList.add('active');
        t.onclick = () => {
            detailMainImg.src = img;
            thumbContainer.querySelectorAll('img').forEach(e=>e.classList.remove('active'));
            t.classList.add('active');
        };
        thumbContainer.appendChild(t);
    });

    productDetail.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function cerrarDetalle(){ 
    productDetail.classList.remove('active');
    document.body.style.overflow = 'auto';
}

function enviarWhatsAppDetalle(){
    const cantidad = detailCantidad.value;
    const producto = detailTitle.textContent;
    const mensaje = `Hola! Quiero comprar ${cantidad} ${producto}`;
    const numero = "5129473241";
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
    window.open(url,'_blank');
}

function compartir(red){
    const urlProducto = window.location.href;
    if(red==='whatsapp'){
        window.open(`https://wa.me/?text=${encodeURIComponent('Mira este producto de Lumabloom: ' + urlProducto)}`,'_blank');
    } else if(red==='instagram'){
        window.open(`https://www.instagram.com/?url=${encodeURIComponent(urlProducto)}`,'_blank');
    } else if(red==='facebook'){
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(urlProducto)}`,'_blank');
    }
}

function irACategoria(categoria) {
    alert(`✨ Categoría seleccionada: ${categoria} ✨`);
}

// Botón subir arriba
window.addEventListener('scroll', function() {
    const subir = document.getElementById('subirArriba');
    if (window.scrollY > 300) {
        subir.classList.add('visible');
    } else {
        subir.classList.remove('visible');
    }
});

document.getElementById('subirArriba').addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
});

// Cerrar modal con tecla ESC
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        if (productDetail.classList.contains('active')) {
            cerrarDetalle();
        }
        if (document.getElementById('adminPanel').classList.contains('active')) {
            cerrarAdminPanel();
        }
        if (document.getElementById('adminLoginModal').classList.contains('active')) {
            cerrarLoginAdmin();
        }
    }
});

function cambiarIdioma() {
    const btn = document.querySelector('.idioma-btn');
    if (btn.textContent === 'ES') {
        btn.textContent = 'EN';
        alert('🌎 Idioma cambiado a Inglés');
        // Aquí iría la lógica real de cambio de idioma
    } else {
        btn.textContent = 'ES';
        alert('🌎 Idioma cambiado a Español');
    }
}
